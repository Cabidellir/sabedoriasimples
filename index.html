<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3375728934205202" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Sabedoria Simples | Mistérios da Mente e Filosofia</title>
    <meta name="description" content="Explore lições de estoicismo, minimalismo e psicologia para uma vida com mais propósito. Artigos profundos sobre filosofia antiga e moderna aplicada ao dia a dia.">
    
    <meta property="og:title" content="Sabedoria Simples | Mistérios da Mente e Filosofia">
    <meta property="og:description" content="Lições atemporais sobre estoicismo, mente e comportamento.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sabedoriasimples.blog/">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #C6A667; --dark: #1a1a1a; }
        
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .portal-card {
            background: #fff;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .portal-card:hover {
            border-bottom: 3px solid var(--gold);
            transform: translateY(-5px);
        }

        .portal-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eee;
        }

        .portal-content { padding: 15px 0; }
        
        .portal-tag {
            color: var(--gold);
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .portal-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 8px 0;
            line-height: 1.3;
        }

        .portal-excerpt {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        /* Hero Section Dinâmico */
        .hero-portal {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 0 20px;
            min-height: 450px;
        }

        @media (max-width: 768px) { .hero-portal { grid-template-columns: 1fr; } }

        .main-featured {
            position: relative;
            height: 450px;
            overflow: hidden;
            border-radius: 4px;
            display: block;
            text-decoration: none;
        }

        .main-featured img { width: 100%; height: 100%; object-fit: cover; }

        .main-featured-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 20px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
        }
    </style>
</head>

<body>

<header></header>

<main>
    <section class="hero-portal" id="hero-area">
        <div class="main-featured">
            <div class="main-featured-overlay">
                <h1 style="font-size: 2rem; font-family: 'Montserrat'; margin: 10px 0;">
                    Sabedoria Simples: Lições de Estoicismo e Mistérios da Mente
                </h1>
            </div>
        </div>
    </section>

    <h2 style="max-width: 1200px; margin: 40px auto 10px; padding: 0 20px; font-family: 'Montserrat';">Últimas Descobertas</h2>
    
    <section class="portal-grid" id="portal-grid">
        </section>
</main>

<footer></footer>

<script src="js/main.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const heroArea = document.getElementById("hero-area");
        const grid = document.getElementById("portal-grid");
        
        fetch('artigos.json')
            .then(response => response.json())
            .then(artigos => {
                if(artigos.length === 0) return;

                // 1. Destaque Principal - AJUSTADO PARA H1 (Exigência SEO)
                const principal = artigos[0];
                let heroHTML = `
                    <a href="${principal.link}" class="main-featured">
                        <img src="${principal.imagem}" alt="${principal.titulo}">
                        <div class="main-featured-overlay">
                            <span class="portal-tag">${principal.tag}</span>
                            <h1 style="font-size: 2rem; font-family: 'Montserrat'; margin: 10px 0;">${principal.titulo}</h1>
                        </div>
                    </a>
                    <div id="side-featured" style="display: flex; flex-direction: column; gap: 20px;"></div>
                `;
                heroArea.innerHTML = heroHTML;

                // 2. Destaques Laterais
                const sideFeatured = document.getElementById("side-featured");
                for (let i = 1; i <= 2; i++) {
                    if(artigos[i]) {
                        sideFeatured.innerHTML += `
                            <a href="${artigos[i].link}" class="portal-card">
                                <img src="${artigos[i].imagem}" class="portal-thumbnail" style="height: 150px;">
                                <div class="portal-content">
                                    <span class="portal-tag">${artigos[i].tag}</span>
                                    <h3 class="portal-title" style="font-size: 1rem;">${artigos[i].titulo}</h3>
                                </div>
                            </a>
                        `;
                    }
                }

                // 3. Grid de Artigos Restantes
                artigos.slice(3).forEach(artigo => {
                    grid.innerHTML += `
                        <a href="${artigo.link}" class="portal-card">
                            <img src="${artigo.imagem}" class="portal-thumbnail" alt="${artigo.titulo}">
                            <div class="portal-content">
                                <span class="portal-tag">${artigo.tag}</span>
                                <h3 class="portal-title">${artigo.titulo}</h3>
                                <p class="portal-excerpt">${artigo.resumo}</p>
                                <span style="font-size:0.7rem; color:#bbb;">${artigo.data}</span>
                            </div>
                        </a>
                    `;
                });
            })
            .catch(error => console.error('Erro ao carregar artigos:', error));
    });
</script>

</body>
</html>
