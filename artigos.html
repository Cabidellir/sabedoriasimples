<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Sabedoria | Sabedoria Simples</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        .archive-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        /* Filtros Estilizados */
        .filter-wrapper { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 50px; 
            flex-wrap: wrap; 
        }

        .filter-btn {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #888;
        }

        .filter-btn:hover { border-color: #C6A667; color: #C6A667; }
        .filter-btn.active { 
            background: #C6A667; 
            border-color: #C6A667; 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(198, 166, 103, 0.3); 
        }

        /* Lista de Artigos */
        .archive-item { 
            display: block;
            margin-bottom: 40px; 
            padding-bottom: 30px; 
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: inherit;
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .archive-item:hover h2 { color: #C6A667; }
        .archive-item .category { font-size: 0.7rem; text-transform: uppercase; color: #C6A667; font-weight: 800; margin-bottom: 10px; display: block; }
        .archive-item h2 { margin: 8px 0; font-size: 1.7rem; font-family: 'Montserrat', sans-serif; transition: color 0.3s; }
        .archive-item p { color: #555; font-size: 1rem; line-height: 1.7; font-family: 'Lora', serif; }
        
        .post-meta { font-size: 0.75rem; color: #aaa; margin-top: 15px; font-family: 'Montserrat'; font-weight: 400; }
    </style>
</head>
<body>

<header></header>

<main class="archive-container">
    <header style="text-align: center; margin-bottom: 50px;">
        <h1 style="font-size: 2.5rem; font-family: 'Montserrat'; font-weight: 800;">Biblioteca de Sabedoria</h1>
        <p style="color: #888;">Explore nossa curadoria de conhecimento para uma vida intencional.</p>
    </header>

    <nav class="filter-wrapper">
        <button class="filter-btn active" data-group="all">Todos</button>
        <button class="filter-btn" data-group="filosofia">Filosofia</button>
        <button class="filter-btn" data-group="mente">Mente & Saúde</button>
        <button class="filter-btn" data-group="digital">Era Digital</button>
        <button class="filter-btn" data-group="pratica">Vida Prática</button>
    </nav>

    <section id="full-articles-list">
        </section>
</main>

<footer></footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const listContainer = document.getElementById("full-articles-list");
        const filterButtons = document.querySelectorAll(".filter-btn");
        let artigosData = [];

        // Mapeamento para unir tags similares em grupos mestres
        const categoriaMapa = {
            "filosofia": ["Filosofia", "Estoicismo", "Filosofia de Vida", "Filosofia da Mente"],
            "mente": ["Psicologia", "Saúde Mental", "Mistérios da Mente", "Inteligência Emocional", "Autoconhecimento", "Bem-estar"],
            "digital": ["Minimalismo Digital", "Filosofia Prática"], // Unindo o foco em tecnologia/prática moderna
            "pratica": ["Estratégia", "Produtividade", "Desenvolvimento", "Vida Simples", "Reflexão"]
        };

        function renderArtigos(lista) {
            listContainer.innerHTML = "";
            lista.forEach((artigo, index) => {
                const itemHTML = `
                    <a href="${artigo.link}" class="archive-item" style="animation-delay: ${index * 0.05}s">
                        <span class="category">${artigo.tag}</span>
                        <h2>${artigo.titulo}</h2>
                        <p>${artigo.resumo}</p>
                        <div class="post-meta">${artigo.data} • Sabedoria Simples</div>
                    </a>
                `;
                listContainer.innerHTML += itemHTML;
            });
        }

        fetch('artigos.json')
            .then(res => res.json())
            .then(data => {
                artigosData = data;
                renderArtigos(artigosData);
            });

        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                const grupo = btn.getAttribute("data-group");

                if (grupo === "all") {
                    renderArtigos(artigosData);
                } else {
                    const filtrados = artigosData.filter(artigo => {
                        // Verifica se a tag do artigo pertence ao grupo mapeado
                        return categoriaMapa[grupo].includes(artigo.tag);
                    });
                    renderArtigos(filtrados);
                }
            });
        });
    });
</script>

</body>
</html>
