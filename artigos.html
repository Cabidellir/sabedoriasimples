<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Sabedoria | Todos os Artigos | Sabedoria Simples</title>
    <meta name="description" content="Explore nossa coleção completa de artigos sobre estoicismo, minimalismo digital, saúde mental e filosofia prática.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        .archive-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .archive-item { 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 35px; 
            padding-bottom: 25px; 
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .archive-item:hover { transform: translateX(10px); }
        
        .archive-item .category { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            color: #C6A667; 
            font-weight: 800; 
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .archive-item h2 { 
            margin: 5px 0; 
            font-size: 1.8rem; 
            line-height: 1.2; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .archive-item p { 
            color: #666; 
            font-size: 1rem; 
            line-height: 1.6; 
            margin-top: 12px; 
            font-family: 'Lora', serif;
        }
        
        .post-info { 
            font-size: 0.8rem; 
            color: #999; 
            margin-top: 15px; 
            display: flex; 
            gap: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        #loading-msg { text-align: center; padding: 50px; color: #bbb; font-style: italic; }
    </style>
</head>
<body>

<header></header>

<main class="archive-container">
    <header style="text-align: center; margin-bottom: 60px;">
        <h1 style="font-size: 3rem; font-family: 'Montserrat'; font-weight: 800;">Biblioteca de Sabedoria</h1>
        <p style="color: #777; font-size: 1.1rem;">Uma cronologia de reflexões para uma vida equilibrada.</p>
    </header>

    <section class="articles-list" id="full-articles-list">
        <p id="loading-msg">Consultando os pergaminhos da sabedoria...</p>
    </section>
</main>

<footer></footer>

<script src="js/main.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const listContainer = document.getElementById("full-articles-list");
        
        fetch('artigos.json')
            .then(response => response.json())
            .then(artigos => {
                listContainer.innerHTML = "";

                artigos.forEach(artigo => {
                    const itemHTML = `
                        <a href="${artigo.link}" class="archive-item">
                            <span class="category">${artigo.tag}</span>
                            <h2>${artigo.titulo}</h2>
                            <p>${artigo.resumo}</p>
                            <div class="post-info">
                                <span>${artigo.data}</span>
                                <span>• 8 min de leitura</span>
                            </div>
                        </a>
                    `;
                    listContainer.innerHTML += itemHTML;
                });
            })
            .catch(error => {
                console.error('Erro ao carregar biblioteca:', error);
                listContainer.innerHTML = "<p>Erro ao carregar os artigos. Por favor, tente novamente mais tarde.</p>";
            });
    });
</script>

</body>
</html>
