<body>
    <header>
        <h1>Sabedoria Simples</h1>

    <main>
        <section id="contact-section">
            <h2>Entre em Contato</h2>
            <p>Tem algo que você gostaria de compartilhar ou perguntar?<br>
            Nos envie uma mensagem! 😊</p>

            <form action="mailto:SEU-EMAIL-AQUI" method="POST" enctype="text/plain">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" placeholder="Seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seunome@email.com" required>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" placeholder="Escreva sua mensagem..." rows="6" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Sabedoria Simples — Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
